name: publicator-pre

services:
  postgres:
    image: postgres:18
    container_name: publicator-pre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: publicator_pre
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "${PRE_DB_PASSWORD:?PRE_DB_PASSWORD must be set}"
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - publicator-pre-postgres-data:/var/lib/postgresql
      # Scripts run once, only when the data volume is empty.
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/pre/02-migrations-baseline.sql:/docker-entrypoint-initdb.d/02-migrations-baseline.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d publicator_pre" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - publicator-pre-network

  api:
    image: publicator-pre-api:latest
    container_name: publicator-pre-api
    restart: unless-stopped
    build:
      context: ./api
    environment:
      NODE_ENV: production
      PORT: "3000"
      MEDIA_DIR: /app/media
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: admin
      DB_PASSWORD: "${PRE_DB_PASSWORD:?PRE_DB_PASSWORD must be set}"
      DB_NAME: publicator_pre
    expose:
      - "3000"
    volumes:
      - ./media-pre:/app/media
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3000/assets').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - publicator-pre-network

  admin:
    image: publicator-pre-admin:latest
    container_name: publicator-pre-admin
    restart: unless-stopped
    build:
      context: ./admin
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - publicator-pre-network

networks:
  publicator-pre-network:
    name: publicator-pre-network

volumes:
  publicator-pre-postgres-data:
    name: publicator-pre-postgres-data
